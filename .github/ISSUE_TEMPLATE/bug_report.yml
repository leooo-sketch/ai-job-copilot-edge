name: Bug report
description: Report a reproducible extension or site-adapter problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste API keys, full resumes, recruiter messages, or unredacted account data."
  - type: dropdown
    id: site
    attributes:
      label: Site
      options: [BOSS Zhipin, Liepin, Zhaopin, Extension UI, Model API, Other]
    validations:
      required: true
  - type: input
    id: edge-version
    attributes:
      label: Edge version
      placeholder: "151.0.x"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the page type and a minimal, redacted sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, resume data, recruiter messages, and personal identifiers.
          required: true
